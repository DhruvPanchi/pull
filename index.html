<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOLO/CARD — tuning bench</title>
<style>
  /* ---------- registered custom properties so pointer vars can transition ---------- */
  @property --px { syntax: "<number>"; inherits: true; initial-value: 0.5; }
  @property --py { syntax: "<number>"; inherits: true; initial-value: 0.5; }

  :root {
    --foil: 0.75;
    --sparkle: 0.55;
    --glare: 0.55;
    --band: 110deg;
    --max-tilt: 16deg;

    --tier-frame: linear-gradient(155deg, #f0cd7a, #a06be0 38%, #4fc3f7 72%, #f0cd7a);
    --tier-glow: rgba(150, 110, 255, 0.35);
    --tier-chip-bg: linear-gradient(120deg, #f0cd7a, #b07ae8);
    --tier-chip-fg: #1c1030;

    --ink: #e8e6f0;
    --ink-dim: #9a96ad;
    --panel-bg: rgba(20, 20, 32, 0.85);
    --panel-line: rgba(255, 255, 255, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; background: #060510; }
  body {
    min-height: 100%;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120% 90% at 50% 0%, #191627 0%, #0d0b16 55%, #060510 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .stage {
    display: flex;
    flex-wrap: wrap;
    gap: 48px;
    align-items: center;
    justify-content: center;
    max-width: 980px;
    width: 100%;
  }

  /* =============================== CARD =============================== */

  .card-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .scene {
    perspective: 1100px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: grab;
    /* pointer vars ease back when released; .dragging kills the lag */
    transition: --px 0.55s cubic-bezier(0.22, 0.7, 0.3, 1),
                --py 0.55s cubic-bezier(0.22, 0.7, 0.3, 1);
  }
  .scene.dragging { transition: none; cursor: grabbing; }

  .tilt {
    width: min(340px, 78vw);
    aspect-ratio: 5 / 7;
    transform-style: preserve-3d;
    transform: rotateX(calc((0.5 - var(--py)) * 2 * var(--max-tilt)))
               rotateY(calc((var(--px) - 0.5) * 2 * var(--max-tilt)));
  }

  .flipper {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 0.72s cubic-bezier(0.35, 0.1, 0.2, 1);
  }
  .scene.flipped .flipper { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    padding: 9px;
    background: var(--tier-frame);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.25) inset,
      0 -1px 0 rgba(0, 0, 0, 0.4) inset,
      calc((0.5 - var(--px)) * 34px) calc((0.5 - var(--py)) * 26px + 24px) 48px -14px rgba(0, 0, 0, 0.65),
      0 24px 70px -18px var(--tier-glow);
  }
  .face.back { transform: rotateY(180deg); }

  .face .inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 13px;
    overflow: hidden;
    isolation: isolate;              /* keeps blend modes inside the card */
    background: #0b0a14;
    transform: translateZ(0);
  }

  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* glassy lip around the art window, above the blend stack */
  .face .inner::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.09),
      inset 0 12px 24px -14px rgba(255, 255, 255, 0.35),
      inset 0 -14px 26px -18px rgba(0, 0, 0, 0.7);
    pointer-events: none;
  }

  /* 1 — artwork */
  .photo {
    background-color: #171233;
    background-size: cover;
    background-position: center;
  }

  /* 2 — rainbow foil: repeating gradient, oversized, panned by the pointer */
  .foil {
    background-image:
      repeating-linear-gradient(var(--band),
        hsl(2 95% 61%) 0%,
        hsl(40 100% 60%) 5.5%,
        hsl(85 90% 56%) 11%,
        hsl(175 92% 55%) 16.5%,
        hsl(222 100% 66%) 22%,
        hsl(285 92% 64%) 27.5%,
        hsl(2 95% 61%) 33%),
      repeating-linear-gradient(calc(var(--band) + 63deg),
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.35) 2.6%,
        rgba(120, 80, 200, 0.18) 4.4%,
        rgba(0, 0, 0, 0.28) 6.4%,
        rgba(255, 255, 255, 0) 9%);
    background-size: 240% 240%, 320% 320%;
    background-position:
      calc(var(--px) * 100%) calc(var(--py) * 100%),
      calc((1 - var(--px)) * 100%) calc((1 - var(--py)) * 100%);
    background-blend-mode: overlay;
    mix-blend-mode: overlay;         /* NOT color-dodge — that nukes the midtones */
    filter: saturate(calc(0.7 + var(--foil) * 0.65)) contrast(1.05);
    opacity: min(0.92, calc(var(--foil) * 0.82));
  }

  /* 3 — glitter: four tiled dot fields, each parallaxing at its own rate.
     Dots sit off-center in each tile (different corner per field) so the four
     lattices interleave instead of lining up into a visible grid. */
  .sparkle {
    background-image:
      radial-gradient(circle at 21% 33%, rgba(255, 255, 255, 0.95) 0 0.7px, rgba(255, 255, 255, 0) 1.5px),
      radial-gradient(circle at 72% 64%, rgba(255, 236, 204, 0.9) 0 0.9px,  rgba(255, 255, 255, 0) 1.8px),
      radial-gradient(circle at 44% 82%, rgba(205, 232, 255, 0.9) 0 1.1px,  rgba(255, 255, 255, 0) 2.2px),
      radial-gradient(circle at 81% 17%, rgba(255, 255, 255, 1) 0 1.2px,
                      rgba(255, 255, 255, 0.25) 2.3px, rgba(255, 255, 255, 0) 4.5px);
    background-size: 26px 26px, 41px 41px, 59px 59px, 83px 83px;
    background-position:
      calc(var(--px) * -18px) calc(var(--py) * -12px),
      calc(var(--px) *  26px) calc(var(--py) *  20px),
      calc(var(--px) * -44px) calc(var(--py) *  34px),
      calc(var(--px) *  62px) calc(var(--py) * -52px);
    mix-blend-mode: screen;
    opacity: min(1, calc(var(--sparkle) * 1.15));
    -webkit-mask-image: radial-gradient(95% 75% at calc(var(--px) * 100%) calc(var(--py) * 100%),
      rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.4) 40%, rgba(0, 0, 0, 0.06) 75%);
    mask-image: radial-gradient(95% 75% at calc(var(--px) * 100%) calc(var(--py) * 100%),
      rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.4) 40%, rgba(0, 0, 0, 0.06) 75%);
  }

  /* 4 — glare hotspot riding the pointer */
  .glare {
    background: radial-gradient(farthest-corner circle at calc(var(--px) * 100%) calc(var(--py) * 100%),
      rgba(255, 255, 255, 0.85) 0%,
      rgba(255, 255, 255, 0.28) 22%,
      rgba(60, 50, 90, 0.22) 58%,
      rgba(0, 0, 0, 0.35) 100%);
    mix-blend-mode: overlay;
    opacity: var(--glare);
  }

  /* 5 — name plate */
  .plate {
    top: auto;
    padding: 42px 14px 12px;
    background: linear-gradient(rgba(8, 6, 18, 0) 0%, rgba(8, 6, 18, 0.72) 46%, rgba(8, 6, 18, 0.92) 100%);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
  }
  .plate .name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .plate .sub {
    margin-top: 3px;
    font-size: 10.5px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .chip {
    flex: none;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 5px 9px 4px;
    border-radius: 999px;
    background: var(--tier-chip-bg);
    color: var(--tier-chip-fg);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 2px 8px rgba(0, 0, 0, 0.45);
  }

  /* ------------------------------- back face ------------------------------- */
  .back .inner {
    background:
      radial-gradient(90% 70% at 50% 12%, #201a38 0%, #0d0a1a 60%, #080614 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .back .backfoil {
    background-image: repeating-linear-gradient(calc(var(--band) + 20deg),
      hsl(260 80% 60% / 0.5) 0%, hsl(190 90% 55% / 0.5) 9%, hsl(320 80% 60% / 0.5) 18%);
    background-size: 260% 260%;
    background-position: calc(var(--px) * 100%) calc(var(--py) * 100%);
    mix-blend-mode: overlay;
    opacity: 0.55;
  }
  .back .backglare {
    background: radial-gradient(farthest-corner circle at calc(var(--px) * 100%) calc(var(--py) * 100%),
      rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.12) 30%, rgba(0, 0, 0, 0.3) 100%);
    mix-blend-mode: overlay;
    opacity: 0.5;
  }
  .back .mark {
    font-size: 34px;
    line-height: 1;
    background: linear-gradient(135deg, #f0cd7a, #a06be0, #4fc3f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 10px rgba(120, 90, 220, 0.5));
  }
  .back .brand {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--ink);
  }
  .back .meta {
    margin-top: 26px;
    width: 78%;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
  .back .meta div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 2px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .back .meta dt { color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.18em; font-size: 9px; padding-top: 1px; }
  .back .meta dd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink); text-align: right; }
  .back .serial {
    margin-top: 26px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.18em;
    color: #cfc8ea;
  }
  .back .barcode {
    margin-top: 10px;
    width: 58%;
    height: 26px;
    background: repeating-linear-gradient(90deg,
      #cfc8ea 0 2px, transparent 2px 5px, #cfc8ea 5px 6px, transparent 6px 11px,
      #cfc8ea 11px 14px, transparent 14px 16px);
    opacity: 0.8;
  }

  .hint {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  /* =============================== PANEL =============================== */

  .panel {
    width: 300px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    padding: 20px 20px 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8);
  }
  .panel h1 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 16px;
  }
  .panel h1 b { color: var(--ink); }

  /* ------- photo input ------- */
  .dropzone {
    display: block;
    position: relative;
    border: 1.5px dashed rgba(160, 122, 232, 0.45);
    border-radius: 12px;
    background: rgba(160, 122, 232, 0.07);
    padding: 20px 14px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 10px;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: #a07ae8;
    background: rgba(160, 122, 232, 0.16);
  }
  .dropzone input {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .dropzone .dz-big {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .dropzone .dz-small {
    margin-top: 4px;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .ghost {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--panel-line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 16px;
  }
  .ghost:hover { background: rgba(255, 255, 255, 0.09); color: var(--ink); }

  .tiers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 18px;
  }
  .tiers button {
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 8px 0 7px;
    border-radius: 8px;
    border: 1px solid var(--panel-line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tiers button:hover { background: rgba(255, 255, 255, 0.09); color: var(--ink); }
  .tiers button[aria-pressed="true"] {
    background: rgba(160, 120, 255, 0.18);
    border-color: rgba(160, 120, 255, 0.55);
    color: #e6dcff;
  }

  .ctl { margin-bottom: 13px; }
  .ctl label {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 5px;
  }
  .ctl output {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink);
    letter-spacing: 0;
  }
  .ctl input[type="range"] {
    width: 100%;
    accent-color: #a07ae8;
    cursor: pointer;
  }

  .readout {
    margin-top: 6px;
    position: relative;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.75;
    color: #b9e3c6;
    white-space: pre;
    overflow-x: auto;
  }
  .readout .copy {
    position: absolute;
    top: 8px;
    right: 8px;
    font: inherit;
    font-size: 9.5px;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--panel-line);
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink-dim);
    cursor: pointer;
  }
  .readout .copy:hover { color: var(--ink); background: rgba(255, 255, 255, 0.12); }

  /* ------- export ------- */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 14px;
  }
  .actions button {
    font: inherit;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 0 9px;
    border-radius: 8px;
    border: 1px solid rgba(160, 120, 255, 0.4);
    background: rgba(160, 120, 255, 0.14);
    color: #e6dcff;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .actions button:hover { background: rgba(160, 120, 255, 0.26); border-color: rgba(160, 120, 255, 0.7); }
  .actions button:disabled { opacity: 0.45; cursor: default; }
  .actions button[hidden] { display: none; }

  .status {
    min-height: 15px;
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
  }
  .exportPreview {
    display: none;
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid var(--panel-line);
  }
  .exportPreview.show { display: block; }

  /* =========================== reduced motion =========================== */
  @media (prefers-reduced-motion: reduce) {
    .scene { transition: none; }
    .flipper { transition: transform 0.001s; }
  }

  @media (max-width: 760px) {
    body { padding: 24px 14px; }
    .stage { gap: 30px; }
    .panel { width: min(340px, 92vw); }
  }
</style>
</head>
<body>
<main class="stage">

  <section class="card-zone">
    <div class="scene" id="scene" data-tier="holo">
      <div class="tilt" id="tilt">
        <div class="flipper" id="flipper">

          <div class="face front">
            <div class="inner">
              <div class="layer photo"  id="photo"></div>
              <div class="layer foil"></div>
              <div class="layer sparkle"></div>
              <div class="layer glare"></div>
              <div class="layer plate">
                <div>
                  <div class="name" id="cardName">NEBULA WARDEN</div>
                  <div class="sub" id="cardSub">Celestial &middot; 042 / 500</div>
                </div>
                <span class="chip" id="chip">Holo</span>
              </div>
            </div>
          </div>

          <div class="face back">
            <div class="inner">
              <div class="layer backfoil"></div>
              <div class="layer backglare"></div>
              <div class="mark">&#9670;</div>
              <div class="brand">HOLO/CARD</div>
              <dl class="meta">
                <div><dt>Minted</dt><dd id="mintDate">—</dd></div>
                <div><dt>Time</dt><dd id="mintTime">—</dd></div>
                <div><dt>Source</dt><dd>index.html &middot; local</dd></div>
                <div><dt>Tier</dt><dd id="backTier">holo</dd></div>
              </dl>
              <div class="serial" id="serial">—</div>
              <div class="barcode"></div>
            </div>
          </div>

        </div>
      </div>
    </div>
    <p class="hint">drag to tilt &middot; click to flip</p>
  </section>

  <aside class="panel">
    <h1><b>HOLO/CARD</b> &middot; tuning bench</h1>

    <label class="dropzone" id="dropzone">
      <input id="fileInput" type="file" accept="image/*,.heic,.heif">
      <div class="dz-big">Add your photo</div>
      <div class="dz-small">tap to choose &middot; drag &amp; drop &middot; paste</div>
    </label>
    <button class="ghost" id="clipBtn" hidden>Paste from clipboard</button>

    <div class="tiers" id="tiers">
      <button data-tier="common">Common</button>
      <button data-tier="rare">Rare</button>
      <button data-tier="holo" aria-pressed="true">Holo</button>
      <button data-tier="secret">Secret</button>
    </div>

    <div class="ctl">
      <label for="s-foil">Foil <output id="o-foil">0.75</output></label>
      <input id="s-foil" type="range" min="0" max="1.5" step="0.01" value="0.75">
    </div>
    <div class="ctl">
      <label for="s-sparkle">Sparkle <output id="o-sparkle">0.55</output></label>
      <input id="s-sparkle" type="range" min="0" max="1.5" step="0.01" value="0.55">
    </div>
    <div class="ctl">
      <label for="s-glare">Glare <output id="o-glare">0.55</output></label>
      <input id="s-glare" type="range" min="0" max="1" step="0.01" value="0.55">
    </div>
    <div class="ctl">
      <label for="s-band">Band angle <output id="o-band">110&deg;</output></label>
      <input id="s-band" type="range" min="0" max="180" step="1" value="110">
    </div>
    <div class="ctl">
      <label for="s-tilt">Max tilt <output id="o-tilt">16&deg;</output></label>
      <input id="s-tilt" type="range" min="0" max="30" step="1" value="16">
    </div>

    <div class="readout" id="readout"><button class="copy" id="copyBtn">copy</button></div>

    <div class="actions">
      <button id="pngBtn">Export PNG</button>
      <button id="vidBtn">Export video</button>
    </div>
    <div class="status" id="status"></div>
    <img class="exportPreview" id="exportPreview" alt="Last export preview">
  </aside>

</main>

<script>
(function () {
  "use strict";

  var root = document.documentElement;
  var scene = document.getElementById("scene");
  var chip = document.getElementById("chip");
  var backTier = document.getElementById("backTier");
  var statusEl = document.getElementById("status");
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  function setStatus(msg) { statusEl.textContent = msg || ""; }

  /* ------------------------- placeholder artwork (inline SVG) ------------------------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1337);
  var stars = "";
  for (var i = 0; i < 90; i++) {
    var sx = (rand() * 500).toFixed(1);
    var sy = (rand() * 430).toFixed(1);
    var sr = (0.5 + rand() * 1.4).toFixed(2);
    var so = (0.35 + rand() * 0.65).toFixed(2);
    stars += '<circle cx="' + sx + '" cy="' + sy + '" r="' + sr + '" fill="#fff" opacity="' + so + '"/>';
  }
  var svg =

    var scale = Math.max(W / iw, H / ih);   /* cover: fill, center, never squash */

    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);

  /* ================================ EXPORT ================================
     html2canvas / dom-to-image can't do mix-blend-mode, so the card is
     re-rendered onto a raw canvas: photo → foil ('overlay') → sparkle
     ('screen') → glare ('overlay') → plate/text, mirroring the CSS stack.
     Design space is the CSS card (340×476); `s` scales it up.            */

  var D = { W: 340, H: 476, PAD: 9, R: 20, IR: 13 };

  function rrPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

  /* linear gradient matching CSS angle semantics (0deg = up, clockwise) */
  function cssLinear(ctx, angleDeg, x, y, w, h) {
    var a = (angleDeg - 90) * Math.PI / 180;
    var dx = Math.cos(a), dy = Math.sin(a);
    var L = (Math.abs(w * dx) + Math.abs(h * dy)) / 2;
    var cx = x + w / 2, cy = y + h / 2;
    return ctx.createLinearGradient(cx - dx * L, cy - dy * L, cx + dx * L, cy + dy * L);
  }

  /* one repeating-linear-gradient pass over an oversized rect, panned like
     background-position does with background-size > 100% */
  function foilPass(ctx, ix, iy, iw, ih, sizeMult, angleDeg, cycle, stops, px, py, invert) {
    var gw = iw * sizeMult, gh = ih * sizeMult;
    var ox = ix + (iw - gw) * (invert ? 1 - px : px);
    var oy = iy + (ih - gh) * (invert ? 1 - py : py);
    var g = cssLinear(ctx, angleDeg, ox, oy, gw, gh);
    for (var k = 0; k * cycle < 1 + cycle; k++) {
      for (var si = 0; si < stops.length; si++) {
        var pos = k * cycle + stops[si][0] * cycle;
        if (pos > 1) pos = 1;
        g.addColorStop(pos, stops[si][1]);
        if (pos === 1) { k = 1e9; break; }
      }
    }
    ctx.fillStyle = g;
    ctx.fillRect(ox, oy, gw, gh);
  }

  /* CSS mask falloff on the sparkle layer: stops 0→1, .4→.4, .75→.06, hold */
  function maskAlpha(t) {
    if (t <= 0) return 1;
    if (t < 0.4) return 1 + (0.4 - 1) * (t / 0.4);
    if (t < 0.75) return 0.4 + (0.06 - 0.4) * ((t - 0.4) / 0.35);
    return 0.06;

    canvas.height = D.H * s;

        [0, "rgba(255,255,255,0)"], [0.29, "rgba(255,255,255,0.35)"],
        [0.49, "rgba(120,80,200,0.18)"], [0.71, "rgba(0,0,0,0.28)"], [1, "rgba(255,255,255,0)"]
      ];
      foilPass(ctx, ix, iy, iw, ih, 3.2, v.band + 63, 0.09, shimmer, px, py, true);
      ctx.globalAlpha = 1;
    }

    /* 3 — sparkle, blend 'screen', masked toward the light.
       Canvas can beat the CSS tiling here: each dot gets deterministic
       jitter + size/alpha variation hashed from its lattice index, so the
       export reads as scattered glitter with zero grid, and dots keep
       their identity across video frames (they slide, not flicker). */
    if (v.sparkle > 0.01) {
      ctx.globalCompositeOperation = "screen";
      var sparkOp = Math.min(1, v.sparkle * 1.15);
      var lx = ix + iw * px, ly = iy + ih * py;
      var Rx = iw * 0.95, Ry = ih * 0.75;
      function hash2(a, b, seed) {
        var x = Math.sin(a * 127.1 + b * 311.7 + seed * 74.7) * 43758.5453;
        return x - Math.floor(x);
      }
      SPARK_FIELDS.forEach(function (f, fi) {
        var offX = px * f.mx, offY = py * f.my;
        var i0 = Math.floor((-f.tile - offX) / f.tile), i1 = Math.ceil((iw + f.tile - offX) / f.tile);
        var j0 = Math.floor((-f.tile - offY) / f.tile), j1 = Math.ceil((ih + f.tile - offY) / f.tile);
        var c = "rgba(" + f.color[0] + "," + f.color[1] + "," + f.color[2] + ",";
        for (var ii = i0; ii <= i1; ii++) {
          for (var jj = j0; jj <= j1; jj++) {
            var jx = (hash2(ii, jj, fi * 3 + 1) - 0.5) * 0.9 * f.tile;
            var jy = (hash2(ii, jj, fi * 3 + 2) - 0.5) * 0.9 * f.tile;
            var vr = 0.55 + hash2(ii, jj, fi * 3 + 3) * 0.9;
            var cx = ix + offX + (ii + f.fx) * f.tile + jx;
            var cy = iy + offY + (jj + f.fy) * f.tile + jy;
            var t = Math.sqrt(Math.pow((cx - lx) / Rx, 2) + Math.pow((cy - ly) / Ry, 2));
            var al = maskAlpha(t) * sparkOp * (0.55 + vr * 0.45);
            if (al < 0.03) continue;
            var r = f.r * vr;
            var halo = (f.halo ? f.halo : r * 2.4) * vr;
            var hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, halo);
            hg.addColorStop(0, c + (f.a * al) + ")");
            hg.addColorStop(Math.min(0.9, r / halo), c + (f.a * al * 0.85) + ")");
            hg.addColorStop(1, c + "0)");
            ctx.fillStyle = hg;
            ctx.beginPath(); ctx.arc(cx, cy, halo, 0, 7); ctx.fill();
          }
        }
      });
    }

    /* 4 — glare, blend 'overlay' */
    if (v.glare > 0.01) {
      ctx.globalCompositeOperation = "overlay";
      ctx.globalAlpha = v.glare;
      var glx = ix + iw * px, gly = iy + ih * py;
      var far = Math.sqrt(Math.pow(Math.max(glx - ix, ix + iw - glx), 2) +
                          Math.pow(Math.max(gly - iy, iy + ih - gly), 2));
      var gg = ctx.createRadialGradient(glx, gly, 0, glx, gly, far);
      gg.addColorStop(0, "rgba(255,255,255,0.85)");
      gg.addColorStop(0.22, "rgba(255,255,255,0.28)");
      gg.addColorStop(0.58, "rgba(60,50,90,0.22)");
      gg.addColorStop(1, "rgba(0,0,0,0.35)");
      ctx.fillStyle = gg;
      ctx.fillRect(ix, iy, iw, ih);
      ctx.globalAlpha = 1;
    }

    /* 5 — plate + text furniture, normal blending */
    ctx.globalCompositeOperation = "source-over";
    var plateH = 92, pTop = iy + ih - plateH;
    var pg = ctx.createLinearGradient(0, pTop, 0, iy + ih);
    pg.addColorStop(0, "rgba(8,6,18,0)");
    pg.addColorStop(0.46, "rgba(8,6,18,0.72)");
    pg.addColorStop(1, "rgba(8,6,18,0.92)");
    ctx.fillStyle = pg;
    ctx.fillRect(ix, pTop, iw, plateH);

    var name = document.getElementById("cardName").textContent;
    var sub = document.getElementById("cardSub").textContent.toUpperCase();
    var tx = ix + 14, bottom = iy + ih;
    try { ctx.letterSpacing = "2.3px"; } catch (e) {}
    ctx.fillStyle = "#9a96ad";
    ctx.font = "400 10.5px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(sub, tx, bottom - 14);
    try { ctx.letterSpacing = "1.4px"; } catch (e) {}
    ctx.fillStyle = "#e8e6f0";
    ctx.font = "700 18px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(name, tx, bottom - 30);
    try { ctx.letterSpacing = "0px"; } catch (e) {}

    /* chip */
    try { ctx.letterSpacing = "1.4px"; } catch (e) {}
    ctx.font = "800 10px ui-sans-serif, system-ui, sans-serif";
    var chipText = tier.label.toUpperCase();
    var chW = ctx.measureText(chipText).width + 18, chH = 21;
    var chX = ix + iw - 14 - chW, chY = bottom - 12 - chH;
    rrPath(ctx, chX, chY, chW, chH, chH / 2);
    var cg = cssLinear(ctx, 120, chX, chY, chW, chH);
    cg.addColorStop(0, tier.chipC[0]);
    cg.addColorStop(1, tier.chipC[1]);
    ctx.fillStyle = cg;
    ctx.fill();
    ctx.fillStyle = tier.chipFg;
    ctx.fillText(chipText, chX + 9, chY + 14.5);
    try { ctx.letterSpacing = "0px"; } catch (e) {}

    /* watermark — every export carries it */
    ctx.save();
    ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
    ctx.shadowColor = "rgba(0,0,0,0.45)";
    ctx.shadowBlur = 5;
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.textAlign = "right";
    ctx.fillText("pull", ix + iw - 11, iy + 20);
    ctx.restore();

    /* glass lip */
    rrPath(ctx, ix + 0.5, iy + 0.5, iw - 1, ih - 1, D.IR);
    ctx.strokeStyle = "rgba(255,255,255,0.09)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();  /* un-clip */
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    return canvas;
  }

  var exportCanvas = document.createElement("canvas");
  var EXPORT_POSE = { px: 0.63, py: 0.32 };   /* a flattering fixed light angle */

  function blobToDataURL(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }

  /* share where possible, else a data-URL download link (no blob: URLs) */
  async function deliver(blob, filename) {
    var file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "pull card" });
        setStatus("Shared.");
        return;
      } catch (err) {
        if (err && err.name === "AbortError") { setStatus("Share canceled."); return; }
        /* fall through to download */
      }
    }
    var url = await blobToDataURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus("Saved " + filename);
  }

  var pngBtn = document.getElementById("pngBtn");
  var vidBtn = document.getElementById("vidBtn");
  var preview = document.getElementById("exportPreview");

  pngBtn.addEventListener("click", async function () {
    pngBtn.disabled = true;
    setStatus("Rendering…");
    try {
      renderCard(exportCanvas, 3, EXPORT_POSE.px, EXPORT_POSE.py);
      var blob = await new Promise(function (res) { exportCanvas.toBlob(res, "image/png"); });
      preview.src = await blobToDataURL(blob);
      preview.classList.add("show");
      await deliver(blob, "pull-card.png");
    } catch (err) {
      setStatus("Export failed: " + err.message);
    }
    pngBtn.disabled = false;
  });

  /* ------------------------------ video export ------------------------------
     3.5s scripted light sweep, card re-rendered per frame and drawn with a
     strip-based fake-perspective tilt, recorded off the canvas stream. */
  var VIDEO_OK = !!(window.MediaRecorder &&
    HTMLCanvasElement.prototype.captureStream &&
    (MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ||
     MediaRecorder.isTypeSupported("video/webm;codecs=vp8") ||
     MediaRecorder.isTypeSupported("video/webm")));
  if (!VIDEO_OK) vidBtn.hidden = true;

  function recordVideo(forceMime) {
    return new Promise(function (resolve, reject) {
      var vw = 720, vh = 960;
      var vcan = document.createElement("canvas");
      vcan.width = vw; vcan.height = vh;
      var vctx = vcan.getContext("2d");
      var cardCan = document.createElement("canvas");

      var mime = (forceMime && MediaRecorder.isTypeSupported(forceMime)) ? forceMime :
        ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
          .find(function (m) { return MediaRecorder.isTypeSupported(m); });
      var stream = vcan.captureStream(30);
      var rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
      var chunks = [];
      rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      rec.onstop = function () { resolve(new Blob(chunks, { type: mime })); };
      rec.onerror = function (e) { reject(e.error || new Error("recorder failed")); };

      var DUR = 3500, t0 = performance.now();
      var ch = vh * 0.82, cw = ch * (D.W / D.H);
      var ccx = vw / 2, ccy = vh / 2;

      function frame(nowT) {
        var t = Math.min(1, (nowT - t0) / DUR);
        var px = 0.5 + 0.46 * Math.sin(t * Math.PI * 2);
        var py = 0.5 - 0.15 * Math.sin(t * Math.PI * 4);
        renderCard(cardCan, 1.6, px, py);

        var bg = vctx.createRadialGradient(ccx, vh * 0.3, 60, ccx, vh * 0.45, vh * 0.75);
        bg.addColorStop(0, "#191627");
        bg.addColorStop(1, "#060510");
        vctx.globalAlpha = 1;
        vctx.fillStyle = bg;
        vctx.fillRect(0, 0, vw, vh);

        /* soft shadow under the card */
        vctx.save();
        vctx.filter = "blur(18px)";
        vctx.fillStyle = "rgba(0,0,0,0.55)";
        vctx.beginPath();
        vctx.ellipse(ccx, ccy + ch / 2 + 16, cw * 0.42, 18, 0, 0, 7);
        vctx.fill();
        vctx.restore();

        /* strip-based fake perspective for the tilt */
        var tilt = (px - 0.5) * 2 * 0.16;
        var N = 48, sw = cardCan.width / N, dw = cw / N;
        for (var si = 0; si < N; si++) {
          var f = si / (N - 1) - 0.5;
          var hh = ch * (1 + tilt * f);
          vctx.drawImage(cardCan, si * sw, 0, sw, cardCan.height,
            ccx - cw / 2 + si * dw, ccy - hh / 2 + (py - 0.5) * 14 * f, dw + 0.75, hh);
        }

        if (t < 1) requestAnimationFrame(frame);
        else setTimeout(function () { rec.stop(); }, 120);
      }
      rec.start(200);
      requestAnimationFrame(frame);
    });
  }

  vidBtn.addEventListener("click", async function () {
    vidBtn.disabled = true;
    setStatus("Recording 3.5s sweep…");
    try {
      var blob = await recordVideo();
      setStatus("Video ready (" + (blob.size / 1024 / 1024).toFixed(1) + " MB)");
      await deliver(blob, "pull-card.webm");
    } catch (err) {
      setStatus("Video export failed: " + err.message);
    }
    vidBtn.disabled = false;
  });

  /* ----------------- debug states via location.hash (screenshot rig) ----------------- */
  var params = new URLSearchParams(location.hash.slice(1));
  if (params.has("px")) {
    stopIdle();
    scene.classList.add("dragging");
    root.style.setProperty("--px", params.get("px"));
    root.style.setProperty("--py", params.get("py") || "0.5");
    if (params.has("tier")) setTier(params.get("tier"));
    if (params.get("flip") === "1") scene.classList.add("flipped");
  } else {
    armIdle();
  }

  /* headless test hooks (no-ops for normal use) */
  window.__pull = {
    setTier: setTier,
    png: function (px, py) {
      renderCard(exportCanvas, 3, px == null ? EXPORT_POSE.px : px, py == null ? EXPORT_POSE.py : py);
      return exportCanvas.toDataURL("image/png");
    },
    video: function (wantData, forceMime) {
      return recordVideo(forceMime).then(function (b) {
        if (!wantData) return { size: b.size, type: b.type };
        return blobToDataURL(b).then(function (u) { return { size: b.size, type: b.type, data: u }; });
      });
    },
    ready: function () { return !!photoCanvas; }
  };

  applyVars();
})();
</script>
</body>
</html>
